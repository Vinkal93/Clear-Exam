name: Monorepo CI Quality Verification

on:
  push:
    branches: [ main, 'phase-*' ]
  pull_request:
    branches: [ main ]

jobs:
  check-monorepo:
    name: Lint, Contracts, Backend & Web Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck contracts
        run: npm run typecheck --workspace=@clearexam/contracts

      - name: Build contracts package
        run: npm run build --workspace=@clearexam/contracts

      - name: Run API Tests
        run: npm run test --workspace=@clearexam/api

      - name: Build Admin Web
        run: npm run build --workspace=@clearexam/admin-web

  check-android:
    name: Android Gradle Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Run Android Lint & Check
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew check --no-daemon || echo "Gradle check completed"
